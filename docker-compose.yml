services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: altyapi
      POSTGRES_PASSWORD: altyapi
      POSTGRES_DB: altyapi
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  valkey:
    image: valkey/valkey:8
    ports: ["6379:6379"]
volumes:
  pgdata: {}
